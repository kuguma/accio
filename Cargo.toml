[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/kuguma/accio"

[workspace.dependencies]
windows-sys = { version = "0.60", features = [
  "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Ioctl",
  "Win32_System_IO", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_Globalization",
  "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com",
] }
memchr = "2"
rayon = "1"
parking_lot = "0.12"
arc-swap = "1"
zstd = "0.13"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
regex = "1"
crossbeam-channel = "0.5"
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.33"
egui_extras = "0.33"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# 背景スレッドの panic でアプリ全体を落とさない（panic フックがログに残す）
panic = "unwind"
debug = 1

[profile.dev]
opt-level = 1
