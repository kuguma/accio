name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: build and publish (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build (release)
        run: cargo build --release -p accio
      - name: package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/accio.exe dist/
          Copy-Item README.md, README.ja.md, LICENSE, NOTICE dist/
          Copy-Item -Recurse docs dist/docs
          Compress-Archive -Path dist/* -DestinationPath "accio-$tag-windows-x64.zip"
          Copy-Item target/release/accio.exe "accio-$tag-windows-x64.exe"
          Get-FileHash "accio-$tag-windows-x64.zip", "accio-$tag-windows-x64.exe" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path -Leaf $_.Path)" } | Set-Content SHA256SUMS.txt
      - name: release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            accio-${{ github.ref_name }}-windows-x64.zip
            accio-${{ github.ref_name }}-windows-x64.exe
            SHA256SUMS.txt
