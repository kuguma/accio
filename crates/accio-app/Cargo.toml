[package]
name = "accio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Instant file search for Windows, a superset of Everything"
build = "build.rs"

[[bin]]
name = "accio"
path = "src/main.rs"
# 管理者マニフェスト付きのため非昇格の cargo test からは起動できない
test = false

[dependencies]
accio-ntfs = { path = "../accio-ntfs" }
accio-index = { path = "../accio-index" }
accio-query = { path = "../accio-query" }
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
parking_lot.workspace = true
arc-swap.workspace = true
anyhow.workspace = true
log.workspace = true
env_logger.workspace = true
rayon.workspace = true
crossbeam-channel.workspace = true
regex.workspace = true
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Security", "Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Memory", "Win32_Globalization", "Win32_System_Pipes", "Win32_System_RemoteDesktop"] }
tray-icon = "0.21"
global-hotkey = "0.7"
tiny_http = "0.12"
rfd = "0.15"
windows = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_Foundation", "Win32_UI_Shell_Common", "Win32_Graphics_Gdi", "Win32_System_Ole", "Win32_System_Com_StructuredStorage", "Win32_System_Memory", "Win32_System_SystemServices"] }
raw-window-handle = "0.6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp", "ico", "tiff"] }
windows-core = "0.61"

[build-dependencies]
embed-manifest = "1"
embed-resource = "3"
